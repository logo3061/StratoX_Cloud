<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEK Studios™ | Game Hub</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="grid-bg"></div>
    <header class="fui-GlassNav fixed top-6 left-1/2 -translate-x-1/2 z-[60] w-[90%] max-w-5xl h-16 flex items-center justify-between px-8">
        
        <div class="flex items-center gap-3 cursor-pointer" onclick="showPage('home')">
      <img src="assets/logo.png" class="h-9 w-9 sm:h-9 sm:w-9 rounded-lg" alt="StratoX Logo" onerror="this.style.display='none'"/>
            <span class="text-xs font-black tracking-tighter uppercase">TEK STUDIOS™</span>
        </div>
        <nav class="flex gap-8">
            <button onclick="showPage('home')" id="btn-home" class="nav-link active">Home</button>
            <button onclick="showPage('games')" id="btn-games" class="nav-link">Games</button>
            <button onclick="showPage('status')" id="btn-status" class="nav-link">Status</button>
        </nav>
    </header>

    <main id="page-home" class="page-view pt-44 px-6 max-w-6xl mx-auto pb-20">
        <div class="text-center md:text-left">
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter mb-4">TEK Studios™</h1>
            <p class="text-xl text-slate-400 mb-10 max-w-2xl font-medium leading-relaxed">
                Central command for all <span class="text-white">TEK Studios™</span> powered experiences.
            </p>
            <div class="flex gap-4 justify-center md:justify-start">
                <button onclick="showPage('games')" class="fui-ActionButton">Browse Games</button>
                <a href="https://discord.gg/rUGpysHv5j" class="fui-ActionButton-other">Discord</a>
            </div>
        </div>
    </main>

    <main id="page-games" class="page-view hidden pt-44 px-6 max-w-6xl mx-auto pb-20">
        <h2 class="text-4xl font-black italic mb-2 tracking-tighter uppercase">Available Experiences</h2>
        <p class="text-slate-500 font-bold text-xs uppercase tracking-[0.3em] mb-12">Our Experiences</p>
        
        <div id="game-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

<main id="page-status" class="page-view hidden pt-44 px-6 max-w-5xl mx-auto pb-20">
    <h2 class="text-4xl font-black italic mb-2 tracking-tighter uppercase text-center md:text-left">Studio News</h2>
    <p class="text-slate-500 font-bold text-xs uppercase tracking-[0.3em] mb-12 text-center md:text-left">Pulse of the Multiverse</p>
    
    <div id="news-container" class="flex flex-col gap-4"></div>
</main>

    <footer class="py-10 border-t border-white/5 text-center">
        <p class="text-[10px] font-bold text-slate-600 tracking-[0.3em] uppercase mb-4">© 2026 TEK STUDIOS — MULTIVERSE</p>
    </footer>

    <script>
        // --- DATA SECTION: Easy to modify/add/remove ---
        const newsData = [
    {
        title: "HUB ALPHA",
        date: "07.02.2026",
        desc: "The central command for all TEK Studios experiences is now officially live. Explore our projects through the new interface.",
        type: "Announcement",
        status: "Alpha" // Nutzt dein Farbsystem (Live = Blau)
    },
];
        const games = [
{
        id: "the-shafts",
        title: "THE SHAFTS",
        version: "V1.2 ALPHA",
        desc: "The endless mineshafts",
        longDesc: "The Shafts is a procedural vertical descent experience. Navigate through infinite levels of brutalist architecture while managing oxygen and avoiding 'Obsidian' entities. Every floor is uniquely generated to ensure total unpredictability.",
        tags: ["Realism", "Chaos", "Horror"],
        status: "Pre-Alpha",
        link: "Inactive"
    },
    {
        id: "the-hotel",
        title: "TEK HOTELS",
        version: "V3",
        desc: "The remake of F-Hotel",
        longDesc: "TEK Studios remade the original F-Hotel from FinnTheHuman401!",
        tags: ["Realism", "Chaos", "Horror"],
        status: "Maintenance",
        link: "Inactive"
    },
        ];
function renderNews() {
    const newsContainer = document.getElementById('news-container');
    if (!newsContainer) return;

    newsContainer.innerHTML = newsData.map(news => `
        <div class="fui-GlassCard p-8 mb-4 border-l-4 ${
            news.status === 'Live' ? 'border-l-[#00A2FF]' : 
            news.status === 'Alpha' ? 'border-l-orange-500' : 
            news.status === 'Maintenance' ? 'border-l-red-500' : 
            'border-l-slate-600'
        }">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-[9px] font-black uppercase tracking-[0.3em] ${
                        news.status === 'Live' ? 'text-[#00A2FF]' : 
                        news.status === 'Beta' ? 'text-emerald-400' : 
                        news.status === 'Alpha' ? 'text-orange-500' : 
                        news.status === 'Pre-Alpha' ? 'text-yellow-400' : 
                        news.status === 'Dev' ? 'text-purple-500' : 
                        news.status === 'Maintenance' ? 'text-red-500' : 
                        'text-slate-500'
                    }">${news.type}</span>
                    <h3 class="text-2xl font-black italic tracking-tighter uppercase mt-1">${news.title}</h3>
                </div>
                <span class="text-[10px] font-mono text-slate-600">${news.date}</span>
            </div>
            <p class="text-sm text-slate-400 leading-relaxed max-w-3xl">${news.desc}</p>
        </div>
    `).join('');
}
        // --- RENDER LOGIC ---
      // --- MODAL LOGIC ---
function openModal(gameId) {
    const game = games.find(g => g.id === gameId);
    if (!game) return;

    const content = document.getElementById('modal-content');
    content.innerHTML = `
        <div class="mb-10">
 <div class="flex justify-between items-start mb-6">
                    <div class="mb-6">
                        <div class="w-10 h-1 mb-2 ${
        game.status === 'Live' ? 'bg-[#00A2FF]' : 
        game.status === 'Beta' ? 'bg-emerald-400' : 
        game.status === 'Alpha' ? 'bg-orange-500' : 
        game.status === 'Pre-Alpha' ? 'bg-yellow-400' : 
        game.status === 'Dev' ? 'bg-purple-500' : 
        game.status === 'Maintenance' ? 'bg-red-500' : 
                            'bg-slate-600'
                        }"></div>
                        <span class="text-[9px] font-mono uppercase tracking-widest block text-slate-500 group-hover:text-white transition-colors">
                            ${game.status}
                        </span>
                    </div>
                    <span class="text-[14px] font-mono text-slate-500 uppercase tracking-widest">${game.version}</span>
                </div>
            <span class="text-[10px] font-mono text-blue-500 uppercase tracking-[0.4em] block mb-2">${game.status} | ${game.version}</span>
            <h2 class="text-5xl md:text-7xl font-black italic italic tracking-tighter uppercase">${game.title}</h2>
        </div>
        
        <div class="grid md:grid-cols-2 gap-12">
            <div>
                <p class="text-slate-400 leading-relaxed text-lg mb-8">${game.longDesc || game.desc}</p>
                <div class="flex flex-wrap gap-2">
                    ${game.tags.map(tag => `<span class="px-3 py-1 bg-white/5 rounded text-[10px] font-black uppercase text-slate-400 border border-white/5">${tag}</span>`).join('')}
                </div>
            </div>
            <div class="space-y-6">
                <div class="bg-white/5 p-6 rounded-2xl border border-white/5">
                    <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Development Status</h4>
                    <p class="text-sm">This project is currently in <b class="text-white">${game.status}</b>. Features are subject to change during the development cycle.</p>
                </div>
                <button 
                    ${game.link === 'Inactive' ? 'disabled' : `onclick="window.location.href='${game.link}'"`}
                    class="w-full py-5 rounded-xl font-black uppercase tracking-widest transition-all 
                    ${game.link === 'Inactive' ? 'bg-white/5 text-slate-700 cursor-not-allowed' : 'bg-[#00A2FF] text-black hover:scale-[1.02]'}">
                    ${game.link === 'Inactive' ? 'Unavailable' : 'Launch Experience'}
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('game-modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden'; // Scrollen verhindern
}

function closeModal() {
    document.getElementById('game-modal').classList.add('hidden');
    document.body.style.overflow = 'auto';
}

// Schließen mit ESC-Taste
document.addEventListener('keydown', (e) => { if(e.key === "Escape") closeModal(); });

// --- RENDER LOGIC UPDATE ---
function renderGames() {
    const grid = document.getElementById('game-grid');
    grid.innerHTML = games.map(game => `
        <div onclick="openModal('${game.id}')" class="fui-GlassCard p-8 flex flex-col justify-between cursor-pointer group">
            <div>
                <div class="flex justify-between items-start mb-6">
                    <div class="mb-6">
                        <div class="w-10 h-1 mb-2 ${
        game.status === 'Live' ? 'bg-[#00A2FF]' : 
        game.status === 'Beta' ? 'bg-emerald-400' : 
        game.status === 'Alpha' ? 'bg-orange-500' : 
        game.status === 'Pre-Alpha' ? 'bg-yellow-400' : 
        game.status === 'Dev' ? 'bg-purple-500' : 
        game.status === 'Maintenance' ? 'bg-red-500' : 
                            'bg-slate-600'
                        }"></div>
                        <span class="text-[9px] font-mono uppercase tracking-widest block text-slate-500 group-hover:text-white transition-colors">
                            ${game.status}
                        </span>
                    </div>
                    <span class="text-[14px] font-mono text-slate-500 uppercase tracking-widest">${game.version}</span>
                </div>
                <h3 class="text-2xl font-black mb-3 italic tracking-tighter group-hover:text-[#00A2FF] transition-colors">${game.title}</h3>
                <p class="text-sm text-slate-400 leading-relaxed mb-6">${game.desc}</p>
                <div class="flex gap-2 mb-8">
                    ${game.tags.map(tag => `<span class="px-2 py-1 bg-white/5 rounded text-[8px] font-black uppercase text-slate-500">${tag}</span>`).join('')}
                </div>
            </div>
            <p class="text-[9px] font-black text-slate-600 uppercase tracking-widest text-center">Click for details</p>
        </div>
    `).join('');
}

        // --- PAGE SWITCHER ---
        function showPage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            const btn = document.getElementById(`btn-${pageId}`);
            if(btn) btn.classList.add('active');
            window.scrollTo(0,0);
        }

        // Initialize Hub
        window.onload = () => {
            renderGames();
            renderNews();
            // Hier kannst du deine bestehende fetchStatus() Funktion einfügen
        };
    </script>
    <div id="game-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-4 md:p-10">
    <div class="fui-GlassCard max-w-4xl w-full max-h-[90vh] overflow-y-auto p-8 md:p-16 relative border-blue-500/20">
        <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-500 hover:text-white font-black uppercase text-[10px] tracking-widest">Close [ESC]</button>
        
        <div id="modal-content">
            </div>
    </div>
</div>
</body>
</html>
