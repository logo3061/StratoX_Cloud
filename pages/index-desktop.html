        // --- RENDER LOGIC ---
function launchRoblox(event, placeId) {
    // This stops the click from "bubbling" up to the parent div
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    
    console.log("Launching game:", placeId);
    window.location.href = `https://www.roblox.com/games/${placeId}`;
}

game.status === 'Live' ? 'bg-[#00A2FF]' : 
game.status === 'Beta' ? 'bg-emerald-400' : 
game.status === 'Alpha' ? 'bg-orange-500' : 
game.status === 'Pre-Alpha' ? 'bg-yellow-400' : 
// Neu: Vor Pre-Alpha Stadien
game.status === 'Prototyping' ? 'bg-fuchsia-600' : 
game.status === 'Concept' ? 'bg-slate-500' :

// Neu: Paused & Weiteres
game.status === 'Paused' ? 'bg-gray-400' : 
game.status === 'Cancelled' ? 'bg-zinc-800' : 
// Vorhandene
game.status === 'Dev' ? 'bg-purple-500' :

${game.link === 'Inactive'

}

function closeModal() {
    const modal = document.getElementById('game-modal');
    
    // Klasse für Animation hinzufügen
    modal.classList.add('closing');

    // Wir warten exakt die Zeit der CSS-Transition ab
    setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('closing');
        document.body.style.overflow = 'auto';
        
        // Optional: Inhalt leeren für Performance
        document.getElementById('modal-content').innerHTML = '';
    }, 100); // 300ms passend zum CSS unten
}

// Schließen mit ESC-Taste
document.addEventListener('keydown', (e) => { if(e.key === "Escape") closeModal(); });

        // --- PAGE SWITCHER ---
       function showPage(pageId) {
    const pages = document.querySelectorAll('.page-view');
    const navLinks = document.querySelectorAll('.nav-link');
    
    pages.forEach(p => {
        p.classList.add('hidden');
        // Reset animation by removing and re-adding class if necessary
        p.style.animation = 'none';
        p.offsetHeight; // trigger reflow
        p.style.animation = null;
    });
    
    navLinks.forEach(l => l.classList.remove('active'));
    
    const targetPage = document.getElementById(`page-${pageId}`);
    targetPage.classList.remove('hidden');
    
    const btn = document.getElementById(`btn-${pageId}`);
    if(btn) btn.classList.add('active');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
